<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nanobank — Accès</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nanobank">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=202611190629">
</head>
<body class="locked">
<main class="lock">
  <svg width="56" height="56" viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#f3efe7"/><path d="M14 35V15l19 19V15" fill="none" stroke="#0b0b0c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 6l1.5 4.5L44 12l-4.5 1.5L38 18l-1.5-4.5L32 12l4.5-1.5z" fill="#b89a6a"/></svg>
  <p class="lock-eyebrow">Accès réservé</p>
  <h1>Débloque l’appli Nanobank.</h1>
  <p class="lock-txt">Un seul paiement pour personnaliser ton compte fictif, passer en mode téléphone et faire vivre tes idées.</p>
  <p class="lock-err" id="err" hidden></p>
  <a class="lock-btn" href="https://whop.com/checkout/plan_6QgH0oZmZ9jft" rel="noopener">Débloquer Nanobank — 32,90 €</a>
  <form class="lock-form" method="post" action="/auth/email">
    <label for="email">Déjà acheté ? Entre l’email utilisé pour le paiement</label>
    <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="ton@email.com" required>
    <button type="submit">Accéder à mon appli</button>
  </form>
  <a class="lock-back" href="index.html">← Retour à l’accueil</a>
</main>
<script>
  const msg = {
    'sans-acces': 'Ce compte Whop n’a pas encore acheté Nanobank. Connecte-toi avec le compte utilisé pour l’achat, ou débloque l’appli.',
    'annule': 'Connexion annulée.',
    'session': 'La connexion a expiré, réessaie.',
    'whop': 'Whop n’a pas répondu. Réessaie dans un instant.',
    'email-inconnu': 'Aucun achat trouvé avec cet email. Vérifie l’adresse utilisée lors du paiement sur Whop.',
    'email-invalide': 'Cette adresse email n’est pas valide.'
  }[new URLSearchParams(location.search).get('erreur')];
  const d = new URLSearchParams(location.search).get('d');
  if (new URLSearchParams(location.search).get('achat') === '1') {
    document.querySelector('h1').textContent = 'Merci pour ton achat !';
    document.querySelector('.lock-txt').textContent = 'Entre l’email utilisé pour le paiement pour ouvrir ton appli Nanobank.';
    document.querySelector('.lock-btn').hidden = true;
  }
  if (msg) { const e = document.getElementById('err'); e.textContent = msg + (d ? ' (code : ' + d.replace(/[^a-zA-Z0-9_-]/g, '') + ')' : ''); e.hidden = false; }
</script>
</body>
</html>
