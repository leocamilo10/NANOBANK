# Configuration Netlify : site statique, aucune étape de build
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fichiers internes non publiés
[[redirects]]
  from = "/dist/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/build.py"
  to = "/"
  status = 301
  force = true

# Mise en cache des fichiers statiques
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
